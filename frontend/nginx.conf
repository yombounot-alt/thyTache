server {
    listen 80;
    server_name _;

    # SPA : toute route inconnue retombe sur index.html (React Router gère
    # la navigation côté client).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API backend et avatars uploadés : proxyfiés vers le service `backend`
    # du docker-compose, sur le même hostname/port que le frontend (évite
    # tout souci de CORS puisque le navigateur ne voit qu'une seule origine).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
    }
}
